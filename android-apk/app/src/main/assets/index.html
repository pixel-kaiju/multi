<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#100e13" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Игра для запоминания таблицы умножения на 3–9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Умножалка</title>
<style>
/* Layout: one calm column that fills the screen. Play (portrait) = top bar, progress dots, equation,
   a flexible board that takes all remaining height, answers at thumb height, footer with message and "Дальше".
   Play (phone in landscape) = two columns: controls left, board right.
   Colour: neutral greys everywhere; every example brings its own pastel (--tc). */
:root{
  --bg:#f3f1f6; --surface:#ffffff; --ink:#18141c; --muted:#7a7384; --line:#e2dde9; --soft:#ebe8ef;
  --tc:#c9b3f5; --tc-ink:#18141c; --tap:46px;
  --shadow:0 1px 0 rgba(24,20,28,.04),0 12px 30px -16px rgba(60,50,90,.25);
  --font-display:'Google Sans','Roboto Flex',Roboto,system-ui,'Segoe UI',sans-serif;
  --font-body:Roboto,system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#100e13; --surface:#1a1720; --ink:#f2eff6; --muted:#9a93a6; --line:#2b2632; --soft:#2a2630;
    --shadow:0 12px 30px -16px rgba(0,0,0,.7); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#100e13; --surface:#1a1720; --ink:#f2eff6; --muted:#9a93a6; --line:#2b2632; --soft:#2a2630;
  --shadow:0 12px 30px -16px rgba(0,0,0,.7); color-scheme:dark;
}
@media (pointer:coarse){ :root{ --tap:48px } }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg);overscroll-behavior:none;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:17px; line-height:1.4;
  min-height:100%; display:flex; flex-direction:column;
  overscroll-behavior:none;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  padding-block:16px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{width:100%;max-width:600px;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0}
.screen{flex:1;min-width:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.screen.enter{animation:enter .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.icon-btn{width:var(--tap);height:var(--tap);flex:none;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);transition:transform .15s}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Home */
#home{position:relative}
.topline{position:absolute;top:0;right:0}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(34px,10vw,54px);line-height:1.05;margin:4px 0 10px;padding-right:60px;letter-spacing:-.02em;text-wrap:balance}
.lead{color:var(--muted);font-size:16px;margin:0 0 14px}
.legend{display:flex;gap:7px;margin:0 0 20px}
.legend i{width:12px;height:12px;border-radius:50%}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:15px;min-height:124px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;box-shadow:var(--shadow);transition:transform .2s,border-color .2s}
.tile:active{transform:scale(.97);border-color:var(--tc)}
@media (hover:hover){.tile:hover{transform:translateY(-3px);border-color:var(--tc)}}
.tile .num{font-family:var(--font-display);font-weight:700;font-size:48px;line-height:1}
.tile .dots{display:flex;flex-wrap:wrap;gap:4px}
.tile .dots i{width:9px;height:9px;border-radius:50%;background:var(--tc)}
.tile .pips{position:absolute;top:17px;right:15px;display:flex;gap:4px}
.tile .pips i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.tile .pips i.on{background:var(--tc)}
.tile.mix{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tile.mix .label{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.1;letter-spacing:-.01em}
.note{color:var(--muted);font-size:15px;margin:20px 0 0;max-width:46ch}
@media (max-width:600px){
  .tile{min-height:100px;padding:13px 14px}
  .tile .num{font-size:40px}
  .tile .pips{top:15px;right:14px}
  .note{font-size:14px;margin-top:16px}
}
@media (max-width:600px) and (max-height:720px){ .legend{display:none} }

/* Play: a column that fills the screen */
#play{display:flex;flex-direction:column;min-height:0}
.bar{grid-area:bar;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.bar .spacer{flex:1}
.stars{display:flex;align-items:center;gap:7px;height:var(--tap);padding:0 15px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums}
.stars svg{width:18px;height:18px;fill:var(--tc);stroke:var(--tc);stroke-width:2;stroke-linejoin:round}
.stars.pulse{animation:pulse .6s}
@keyframes pulse{40%{transform:scale(1.18)}}

/* Progress: one dot per example, in that example's colour */
.pipsbar{grid-area:pips;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px;min-height:12px}
.pip{width:12px;height:12px;border-radius:50%;background:var(--pc);opacity:.3;transition:opacity .3s,box-shadow .3s,background .3s}
.pip.cur{opacity:1;box-shadow:0 0 0 3px var(--soft)}
.pip.ok{opacity:1}
.pip.late{opacity:1;background:transparent;box-shadow:inset 0 0 0 3px var(--pc)}

.eq{grid-area:eq;display:flex;align-items:center;justify-content:center;gap:.28em;font-family:var(--font-display);font-weight:700;font-size:clamp(34px,10.5vw,60px);line-height:1;margin:0 0 12px;letter-spacing:-.02em}
.eq .a{background:var(--tc);color:var(--tc-ink);border-radius:.3em;padding:.14em .3em .18em}
.eq .op{color:var(--muted);font-weight:500}
.eq .c{width:1.9em;text-align:left;color:var(--muted)}
.eq .c.filled{color:var(--tc);animation:land .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes land{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}

/* Stage: takes all the height the other blocks leave. contain:size keeps its content from
   pushing the layout, so the dot size is computed from the space instead. */
.stage{grid-area:stage;flex:1 1 0;min-height:200px;min-width:0;contain:size;display:flex;flex-direction:column;gap:6px}
.board{flex:1 1 0;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:14px;box-shadow:var(--shadow);display:grid;justify-content:center;align-content:center;gap:var(--g,8px);touch-action:none;cursor:default}
.row{display:grid;grid-template-columns:repeat(var(--T),var(--d)) auto;gap:var(--g);align-items:center}
/* One pastel colour per example; every row is more opaque than the one before. Size never animates. */
.dot{width:var(--d);height:var(--d);border-radius:50%;background:var(--tc);opacity:0;transition:opacity .25s ease var(--dl,0ms)}
.dot.in{opacity:var(--o,1)}
.dot.pop{animation:dotpop .6s ease-in-out var(--pd,0ms)}
@keyframes dotpop{50%{opacity:1}}
/* Row total: same colour and same opacity as the dots of its row */
.tot{color:var(--tc);min-width:2.6ch;font-weight:700;font-size:calc(var(--d) * .8 + 4px);line-height:1;font-variant-numeric:tabular-nums;opacity:0;transform:translateX(-6px);pointer-events:none;transition:opacity .25s ease var(--td,0ms),transform .3s cubic-bezier(.34,1.56,.64,1) var(--td,0ms)}
.tot.show,.tot.peek{opacity:var(--o,1);transform:none}
.tip{text-align:center;color:var(--muted);font-size:14px;line-height:1.25;margin:0;min-height:18px}

.answers{grid-area:ans;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.ans{min-height:clamp(60px,10vh,84px);border-radius:22px;background:var(--surface);border:2px solid var(--line);font-family:var(--font-display);font-weight:700;font-size:clamp(24px,7.5vw,34px);font-variant-numeric:tabular-nums;transition:transform .15s,border-color .2s,background .3s,color .3s,opacity .3s}
.ans:active{border-color:var(--tc);transform:scale(.96)}
@media (hover:hover){.ans:hover{border-color:var(--tc);transform:translateY(-2px)}}
.ans.hit{background:var(--tc);border-color:var(--tc);color:var(--tc-ink);animation:hit .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes hit{0%{transform:scale(.92)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.ans.dim{opacity:.35}
.ans.miss{opacity:.3;animation:nudge .4s}
@keyframes nudge{25%{transform:translateX(-5px)}60%{transform:translateX(4px)}}
.ans.hit,.ans.dim,.ans.miss{pointer-events:none}

.foot{grid-area:foot;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;margin-top:8px}
.msg{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;color:var(--muted);font-weight:500;font-size:15px;line-height:1.3}
.msg .praise{color:var(--ink);font-weight:700;font-size:19px;animation:land .5s cubic-bezier(.34,1.56,.64,1)}
.msg .expl{font-variant-numeric:tabular-nums}
.primary{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:999px;padding:14px 24px;font-weight:600;font-size:17px;transition:transform .15s}
.primary:active{transform:scale(.96)}
.primary svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#next{display:none;flex:none;min-height:52px;background:var(--tc);color:var(--tc-ink)}
#next.show{display:inline-flex;animation:enter .35s both}
.ghost{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:14px 26px;font-weight:600;font-size:18px}

/* Portrait only: when the phone is turned sideways, ask to turn it back */
.rotate{display:none}
@media (orientation:landscape) and (max-height:520px){
  .rotate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:var(--muted);font-weight:600;padding:16px}
  .rotate svg{width:56px;height:56px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;animation:turn 2.4s ease-in-out infinite}
}
@keyframes turn{0%,30%{transform:rotate(-90deg)}60%,100%{transform:rotate(0)}}

/* Done */
.done{text-align:center;padding-top:8px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bloom{display:grid;place-items:center;height:104px}
.bloom svg{width:84px;height:84px;fill:var(--tc);stroke:var(--tc);stroke-width:2;stroke-linejoin:round;animation:land .7s cubic-bezier(.34,1.56,.64,1)}
.done h2{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,8.5vw,44px);line-height:1.12;margin:4px 0 8px;letter-spacing:-.02em;text-wrap:balance}
.done .sub{color:var(--muted);margin:0 0 18px}
.starfield{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:420px;margin:0 auto}
.starfield svg{width:32px;height:32px;stroke-width:2;stroke-linejoin:round;opacity:0;animation:land .6s cubic-bezier(.34,1.56,.64,1) var(--sd) both}
.recap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:22px auto 0;max-width:420px;text-align:left}
.chip{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .cd{width:10px;height:10px;border-radius:50%;flex:none}
.chip.miss{border-color:var(--muted);background:var(--soft)}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}

/* Effects layer */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
#fx .p{position:absolute;display:block;will-change:transform,opacity}
#fx .ring{position:absolute;display:block;border:3px solid;border-radius:50%}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important;transition-delay:0ms!important}
}
</style>
</head>
<body>

<div class="wrap">

  <section id="home" class="screen">
    <div class="topline"><button class="icon-btn snd" type="button"></button></div>
    <h1>Умножалка</h1>
    <p class="lead">Выбери число, которое хочешь выучить.</p>
    <div class="legend" id="legend" aria-hidden="true"></div>
    <div class="tiles" id="tiles"></div>
    <p class="note">В каждом круге 8 примеров. Ошибки вернутся в конце круга, чтобы лучше запомниться.</p>
  </section>

  <section id="play" class="screen" hidden>
    <div class="bar">
      <button class="icon-btn" id="back" type="button" aria-label="К выбору числа"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="stars" id="stars" role="status"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.2 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg><span id="starN">0</span></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="replay" type="button" aria-label="Показать снова"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
      <button class="icon-btn snd" type="button"></button>
    </div>
    <div class="pipsbar" id="pipsbar" aria-hidden="true"></div>
    <div class="eq" id="eq"><span class="a" id="eqA"></span><span class="op">×</span><span id="eqB"></span><span class="op">=</span><span class="c" id="eqC">?</span></div>
    <div class="stage">
      <div class="board" id="board"></div>
      <p class="tip" id="tip"></p>
    </div>
    <div class="answers" id="answers"></div>
    <div class="foot">
      <div class="msg" id="msg" aria-live="polite"></div>
      <button class="primary" id="next" type="button">Дальше <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
  </section>

  <section id="done" class="screen done" hidden>
    <div class="eyebrow" id="doneLabel"></div>
    <div class="bloom" id="bloom"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.2 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg></div>
    <h2 id="doneTitle"></h2>
    <p class="sub" id="doneSub"></p>
    <div class="starfield" id="starfield"></div>
    <div class="recap" id="recap"></div>
    <div class="actions">
      <button class="primary" id="again" type="button">Ещё раз</button>
      <button class="ghost" id="toHome" type="button">К числам</button>
    </div>
  </section>

</div>
<div id="fx" aria-hidden="true"></div>
<div class="rotate" role="alert"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18.5h2"/></svg><div>Поверни телефон вертикально</div></div>

<script>
// <logic>
const rnd = n => Math.floor(Math.random() * n);
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function makeOptions(t, m){
  const a = t * m;
  const rev = Number(String(a).split('').reverse().join(''));
  const pool = [...new Set([a + t, a - t, (t + 1) * m, (t - 1) * m, t * (m - 1), a + 10, a - 10, rev])]
    .filter(v => v > 0 && v < 100 && v !== a);
  return shuffle([a, ...shuffle(pool).slice(0, 2)]);
}
function makeBase(mode){
  if (mode === 'mix'){
    const all = [];
    for (let t = 3; t <= 9; t++) for (let m = 2; m <= 9; m++) all.push({ t, m });
    return shuffle(all).slice(0, 10);
  }
  return shuffle([2, 3, 4, 5, 6, 7, 8, 9]).map(m => ({ t: mode, m }));
}
function masteryLevel(score){ return score >= 8 ? 3 : score >= 7 ? 2 : score >= 5 ? 1 : 0; }
function rowsWord(m){ return (m >= 2 && m <= 4) ? 'ряда' : 'рядов'; }
/* Dot size from the free space: rows are t dots + a total column, with gaps of .26 of a dot */
function dotSize(t, m, w, h){
  const byW = (w - 8) / (1.26 * t + 1.3);
  const byH = h / (m + 0.26 * (m - 1));
  return Math.floor(Math.max(12, Math.min(46, byW, byH)));
}
// </logic>

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const touchUI = matchMedia('(hover: none)').matches;

/* Calm pastels: розовый, сиреневый, лиловый, голубой, бирюзовый, персиковый, лососевый, мятный,
   коралловый разбеленный, салатовый разбеленный. One colour per example, never mixed on one screen. */
const PAL = ['#f4a3cb', '#c9b3f5', '#cf9be6', '#8ecbf2', '#6fd6cf', '#fcc49c', '#f6a98f', '#9fe0bd', '#f5a0a6', '#bde58a'];
/* Home tiles: each number has its own pastel from the same set */
const TC = { 3: PAL[0], 4: PAL[3], 5: PAL[1], 6: PAL[7], 7: PAL[5], 8: PAL[4], 9: PAL[2] };
const INK = '#18141c';
const STAR = '<path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.2 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/>';
const SPARK = '<svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor"><path d="M12 0C12 7 17 12 24 12 17 12 12 17 12 24 12 17 7 12 0 12 7 12 12 7 12 0Z"/></svg>';
const ICON_ON = '<svg viewBox="0 0 24 24"><path d="M4 9.5v5h4l5 4v-13l-5 4z"/><path d="M16.5 9a4.2 4.2 0 0 1 0 6"/><path d="M19 6.5a8 8 0 0 1 0 11"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24"><path d="M4 9.5v5h4l5 4v-13l-5 4z"/><path d="M17 9.5l4 5M21 9.5l-4 5"/></svg>';
const PRAISE = ['Верно!', 'Отлично!', 'Точно!', 'Здорово!', 'Так держать!', 'Молодец!'];
const NUMW = { 3: 'Три', 6: 'Шесть', 9: 'Девять', 12: 'Двенадцать', 15: 'Пятнадцать' };

$('#tip').textContent = touchUI ? 'Води пальцем по рядам: сколько кружков?' : 'Наведи на ряд: сколько кружков?';

/* Storage: only a light per-viewer convenience */
const KEY = 'umnozhalka-v1';
let data = { best: {}, sound: true };
try {
  const raw = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (raw && typeof raw === 'object'){ data.best = raw.best || {}; if (typeof raw.sound === 'boolean') data.sound = raw.sound; }
} catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} };

/* Sound and a very light vibration share one switch */
let ac;
function ctx(){
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    return ac;
  } catch (e) { return null; }
}
function note(f, at, dur, vol, type = 'sine'){
  const a = ctx(); if (!a) return;
  const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
const SCALE = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66];
function tone(kind, n = 1){
  if (!data.sound) return;
  if (kind === 'ok'){ const i = Math.min(n - 1, 4); note(SCALE[i], 0, .7, .09); note(SCALE[i + 2], .09, .8, .07); }
  else if (kind === 'miss'){ note(220, 0, .35, .05, 'triangle'); }
  else if (kind === 'done'){ [0, 2, 4, 5].forEach((k, j) => note(SCALE[k], j * .12, .9, .07)); }
}
function buzz(p){ if (!data.sound || !touchUI) return; try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
function renderSound(){
  $$('.snd').forEach(b => {
    b.innerHTML = data.sound ? ICON_ON : ICON_OFF;
    b.setAttribute('aria-label', data.sound ? 'Выключить звук' : 'Включить звук');
    b.onclick = () => { data.sound = !data.sound; save(); renderSound(); if (data.sound) tone('ok', 1); };
  });
}

/* Effects: sparkles and rings take the colour of the current example (--tc on #fx) */
const fx = $('#fx');
function burst(x, y, o = {}){
  if (reduce) return;
  const count = o.count || 16, spread = o.spread || 120;
  const cols = o.colors || [
    'var(--tc)', 'color-mix(in srgb, var(--tc) 55%, white)', 'var(--tc)',
    'color-mix(in srgb, var(--tc) 70%, var(--ink))', 'var(--tc)', 'color-mix(in srgb, var(--tc) 55%, white)'
  ];
  for (let i = 0; i < count; i++){
    const el = document.createElement('i'); el.className = 'p';
    const spark = i % 3 === 0, deep = !o.colors && i % 6 === 3;
    const size = deep ? 5 + rnd(3) : spark ? 14 + rnd(10) : 6 + rnd(7);
    el.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px;color:${cols[i % cols.length]}`;
    if (spark && !deep) el.innerHTML = SPARK; else { el.style.background = 'currentColor'; el.style.borderRadius = '50%'; }
    fx.appendChild(el);
    const ang = Math.random() * Math.PI * 2, dist = spread * (.45 + Math.random() * .6);
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 20, rot = (Math.random() - .5) * 240;
    el.animate([
      { transform: 'translate(-50%,-50%) scale(.2) rotate(0deg)', opacity: 0 },
      { transform: `translate(-50%,-50%) translate(${dx * .7}px,${dy * .7}px) scale(1) rotate(${rot * .6}deg)`, opacity: 1, offset: .35 },
      { transform: `translate(-50%,-50%) translate(${dx}px,${dy + 46}px) scale(.5) rotate(${rot}deg)`, opacity: 0 }
    ], { duration: 1000 + rnd(500), easing: 'cubic-bezier(.16,.8,.3,1)', fill: 'forwards' }).onfinish = () => el.remove();
  }
}
function ring(x, y, size = 90, color = 'var(--tc)', delay = 0){
  if (reduce) return;
  const el = document.createElement('i'); el.className = 'ring';
  el.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px;border-color:${color}`;
  fx.appendChild(el);
  el.animate([
    { transform: 'translate(-50%,-50%) scale(.3)', opacity: .85 },
    { transform: 'translate(-50%,-50%) scale(2.8)', opacity: 0 }
  ], { duration: 900, delay, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'both' }).onfinish = () => el.remove();
}

/* Screens */
const screens = { home: $('#home'), play: $('#play'), done: $('#done') };
function show(name){
  for (const k in screens) screens[k].hidden = k !== name;
  const el = screens[name];
  el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter');
  window.scrollTo(0, 0);
}

/* Home */
function renderHome(){
  $('#legend').innerHTML = Object.values(TC).map(c => `<i style="background:${c}"></i>`).join('');
  const box = $('#tiles'); box.innerHTML = '';
  for (let t = 3; t <= 9; t++){
    const lvl = masteryLevel(data.best[t] || 0);
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tile'; b.style.setProperty('--tc', TC[t]);
    b.setAttribute('aria-label', `Таблица на ${t}`);
    b.innerHTML = `<span class="pips">${[1, 2, 3].map(i => `<i class="${i <= lvl ? 'on' : ''}"></i>`).join('')}</span>` +
      `<span class="num">${t}</span><span class="dots">${'<i></i>'.repeat(t)}</span>`;
    b.onclick = () => start(t);
    box.appendChild(b);
  }
  const mix = document.createElement('button');
  mix.type = 'button'; mix.className = 'tile mix'; mix.setAttribute('aria-label', 'Все таблицы вместе');
  mix.innerHTML = `<span class="label">Все<br>вместе</span><span class="dots">${Object.values(TC).map(c => `<i style="background:${c}"></i>`).join('')}</span>`;
  mix.onclick = () => start('mix');
  box.appendChild(mix);
}

/* Session */
let S = null, autoT = 0, nextT = 0, peeked = null;

function start(mode){
  clearTimeout(autoT); clearTimeout(nextT);
  enterPlay();
  const cols = shuffle(PAL);   /* each example of the session gets its own colour */
  const base = makeBase(mode).map((q, i) => ({
    ...q, idx: i, color: cols[i % cols.length], miss: false, done: false, solvedFirst: false, requeued: false
  }));
  S = { mode, base, queue: base.map(q => q.idx), stars: 0, first: 0, streak: 0, locked: true, cur: null, praise: shuffle(PRAISE), pi: 0 };
  $('#pipsbar').innerHTML = base.map(q => `<i class="pip" style="--pc:${q.color}"></i>`).join('');
  $('#starN').textContent = '0';
  show('play');
  nextQ();
}

function markPips(){
  $$('#pipsbar .pip').forEach((p, i) => {
    const q = S.base[i];
    p.className = 'pip' + (q === S.cur && !S.locked ? ' cur' : q.done ? (q.solvedFirst ? ' ok' : ' late') : '');
  });
}

function nextQ(){
  clearTimeout(autoT); clearTimeout(nextT);
  if (!S.queue.length) return finish();
  const q = S.base[S.queue.shift()];
  S.cur = q; S.locked = false;
  const pl = $('#play');
  pl.style.setProperty('--tc', q.color); pl.style.setProperty('--tc-ink', INK);
  fx.style.setProperty('--tc', q.color);
  $('#eqA').textContent = q.t; $('#eqB').textContent = q.m;
  const c = $('#eqC'); c.textContent = '?'; c.className = 'c';
  $('#eq').setAttribute('aria-label', `${q.t} умножить на ${q.m}`);
  buildBoard(q); buildAnswers(q);
  $('#msg').innerHTML = '';
  $('#next').classList.remove('show');
  markPips();
}

function buildBoard(q){
  const b = $('#board');
  b.dataset.t = q.t; b.dataset.m = q.m;
  /* Whole rows fade in one after another, almost at once (about 1-2 s for the biggest examples) */
  const gap = Math.round(Math.min(200, Math.max(150, 1700 / q.m)));
  const fade = 250;
  const rowEnd = [];
  let html = '';
  for (let r = 0; r < q.m; r++){
    const o = (0.32 + 0.68 * r / (q.m - 1)).toFixed(2);   /* first row faint, last row solid */
    const start = r * gap;
    const dots = `<i class="dot" style="--dl:${start}ms" data-r="${r}" data-dl="${start}"></i>`.repeat(q.t);
    const last = r === q.m - 1;
    rowEnd.push(start + fade);
    html += `<div class="row" style="--o:${o}">${dots}<span class="tot" data-v="${q.t * (r + 1)}">${last ? '?' : q.t * (r + 1)}</span></div>`;
  }
  b.innerHTML = html;
  b.style.setProperty('--T', q.t);
  b._rowEnd = rowEnd;
  peeked = null;
  fit(true);
  playBoard();
}

function playBoard(){
  const b = $('#board'), dots = $$('#board .dot');
  dots.forEach(d => { d.classList.remove('in', 'pop'); d.style.transition = 'none'; });
  void b.offsetWidth;
  dots.forEach(d => { d.style.transition = ''; });
  S.t0 = null;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    dots.forEach(d => d.classList.add('in'));
    S.t0 = performance.now();
  }));
}
const elapsed = () => (S && S.t0) ? performance.now() - S.t0 : 0;

/* Row totals on request.
   Mouse or pen: hover a row. Finger: press and drag along the rows, the number follows the finger and
   stays after the finger lifts (the finger covers the row while it is on the screen). A tap on the
   same row again hides it. The last row stays "?" until the answer is found, so it cannot give it away. */
function peek(row){
  if (!row){ if (peeked){ peeked.classList.remove('peek'); peeked = null; } return; }
  if (!S || !S.cur || S.locked) return;
  if (peeked && peeked.parentElement === row) return;
  const dot = row.querySelector('.dot');
  if (Number(dot.dataset.dl) > elapsed()) return;   /* this row has not appeared yet */
  if (peeked) peeked.classList.remove('peek');
  peeked = row.querySelector('.tot');
  peeked.classList.add('peek');
  buzz(6);
}
/* The row nearest to a vertical position; null when the pointer is further than half a row plus tolerance */
function rowAtY(y, tol){
  const rows = $$('#board .row'); if (!rows.length) return null;
  let best = null, bd = 1e9, h = 0;
  for (const r of rows){
    const b = r.getBoundingClientRect(), d = Math.abs(y - (b.top + b.bottom) / 2);
    if (d < bd){ bd = d; best = r; h = b.height; }
  }
  const g = parseFloat(getComputedStyle($('#board')).rowGap) || 0;
  return bd <= h / 2 + g / 2 + tol ? best : null;
}
const boardEl = $('#board');
let touchId = null, touchY0 = 0, touchMoved = false, sameAtDown = false;
boardEl.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'touch') return;
  touchId = e.pointerId; touchY0 = e.clientY; touchMoved = false;
  const row = rowAtY(e.clientY, 14);
  sameAtDown = !!(row && peeked && peeked.parentElement === row);
  try { boardEl.setPointerCapture(e.pointerId); } catch (err) {}
  if (row) peek(row);
});
boardEl.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch'){
    if (e.pointerId !== touchId) return;
    if (Math.abs(e.clientY - touchY0) > 6) touchMoved = true;
    const row = rowAtY(e.clientY, 14);
    if (row) peek(row);              /* past the first or last row the last number stays */
  } else {
    peek(rowAtY(e.clientY, 0));
  }
});
const touchEnd = e => {
  if (e.pointerType !== 'touch' || e.pointerId !== touchId) return;
  if (!touchMoved && sameAtDown) peek(null);
  touchId = null;
};
boardEl.addEventListener('pointerup', touchEnd);
boardEl.addEventListener('pointercancel', touchEnd);
boardEl.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') peek(null); });
/* No context menu or text selection when a child holds a finger on the screen */
document.addEventListener('contextmenu', e => e.preventDefault());

/* Dot size follows the free space of the board (portrait, landscape, any phone) */
let lastFit = '';
function fit(force){
  const b = $('#board');
  if (!b || !b.dataset.t || $('#play').hidden) return;
  const t = +b.dataset.t, m = +b.dataset.m;
  const w = b.clientWidth - 28, h = b.clientHeight - 28;
  if (w <= 0 || h <= 0) return;
  const key = `${t}-${m}-${w}-${h}`;
  if (!force && key === lastFit) return;
  lastFit = key;
  const d = dotSize(t, m, w, h);
  b.style.setProperty('--d', d + 'px');
  b.style.setProperty('--g', Math.round(d * .26) + 'px');
}
addEventListener('resize', () => fit());
if (window.ResizeObserver) new ResizeObserver(() => fit()).observe(boardEl);

function buildAnswers(q){
  const box = $('#answers'); box.innerHTML = '';
  makeOptions(q.t, q.m).forEach(v => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'ans'; b.textContent = v;
    b.onclick = () => pick(b, v);
    box.appendChild(b);
  });
}

function pick(btn, v){
  if (S.locked || btn.classList.contains('miss')) return;
  const q = S.cur;
  if (v === q.t * q.m) correct(btn, q); else wrong(btn, q);
}

function wrong(btn, q){
  btn.classList.add('miss');
  q.miss = true; S.streak = 0;
  tone('miss');
  $('#msg').innerHTML = '<span>Почти! Посмотри на ряды ещё раз.</span>';
  const tots = $$('#board .tot');
  const ends = $('#board')._rowEnd, el0 = elapsed();
  tots.forEach((t, i) => { if (i < tots.length - 1){ t.style.setProperty('--td', `${Math.max(ends[i] - el0, i * 70)}ms`); t.classList.add('show'); } });
}

function correct(btn, q){
  S.locked = true;
  clearTimeout(autoT); clearTimeout(nextT);
  const first = !q.miss;
  S.streak++; S.stars++; if (first) S.first++;
  q.done = true; q.solvedFirst = first;
  if (q.miss && !q.requeued){ q.requeued = true; S.queue.push(q.idx); }

  btn.classList.add('hit');
  $$('#answers .ans').forEach(b => { if (b !== btn) b.classList.add('dim'); });
  const a = q.t * q.m;
  const c = $('#eqC'); c.textContent = a; c.className = 'c filled';
  peek(null);
  const ends = $('#board')._rowEnd, el0 = elapsed();
  /* a quiet wave of light down the rows (opacity only), then every row total */
  $$('#board .dot').forEach(d => {
    const row = Number(d.dataset.r);
    d.style.setProperty('--pd', `${Math.max(row * 60, Number(d.dataset.dl) - el0)}ms`);
    d.classList.add('pop');
  });
  const tots = $$('#board .tot');
  tots.forEach((t, i) => {
    t.textContent = t.dataset.v;
    t.style.setProperty('--td', `${Math.max(ends[i] - el0, i * 70)}ms`);
    t.classList.add('show');
  });

  const r = btn.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  ring(x, y); burst(x, y, { count: 16 });
  const big = S.streak % 3 === 0;
  if (big){
    const er = $('#eq').getBoundingClientRect();
    setTimeout(() => { ring(innerWidth / 2, er.top + er.height / 2, 120); burst(innerWidth / 2, er.top + er.height / 2, { count: 24, spread: 200 }); }, 280);
  }
  tone('ok', S.streak);
  buzz(big ? [20, 50, 20] : 18);

  const word = big ? `${NUMW[S.streak] || S.streak} подряд!` : S.praise[S.pi++ % S.praise.length];
  $('#msg').innerHTML = `<span class="praise">${word}</span><span class="expl">${q.m} ${rowsWord(q.m)} по ${q.t} — это ${a}</span>`;
  $('#starN').textContent = S.stars;
  const st = $('#stars'); st.classList.remove('pulse'); void st.offsetWidth; st.classList.add('pulse');
  markPips();

  nextT = setTimeout(() => $('#next').classList.add('show'), 900);
  autoT = setTimeout(nextQ, Math.max(3800, ends[ends.length - 1] - el0 + 1800));
}

function finish(){
  clearTimeout(autoT); clearTimeout(nextT);
  const N = S.base.length;
  if (typeof S.mode === 'number'){ data.best[S.mode] = Math.max(data.best[S.mode] || 0, S.first); save(); }
  const cols = S.base.map(q => q.color);
  $('#done').style.setProperty('--tc', cols[N - 1]);
  $('#doneLabel').textContent = S.mode === 'mix' ? 'Все вместе' : `Таблица на ${S.mode}`;
  $('#doneTitle').textContent = S.first === N ? 'Без единой ошибки!' : S.first >= N * .6 ? 'Хорошая работа!' : 'Ты прошёл всю таблицу';
  $('#doneSub').textContent = `С первого раза: ${S.first} из ${N}`;
  $('#starfield').innerHTML = Array.from({ length: S.stars }, (_, i) =>
    `<svg viewBox="0 0 24 24" style="--sd:${300 + i * 90}ms;fill:${cols[i % N]};stroke:${cols[i % N]}">${STAR}</svg>`).join('');
  const rc = $('#recap');
  if (typeof S.mode === 'number'){
    rc.innerHTML = [...S.base].sort((p, q) => p.m - q.m)
      .map(q => `<div class="chip${q.miss ? ' miss' : ''}"><i class="cd" style="background:${q.color}"></i>${q.t} × ${q.m} = ${q.t * q.m}</div>`).join('');
  } else rc.innerHTML = '';
  show('done');
  tone('done');
  buzz([20, 60, 20, 60, 30]);
  setTimeout(() => {
    const r = $('#bloom').getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    ring(x, y, 110, cols[0]); ring(x, y, 110, cols[Math.floor(N / 2)], 180); ring(x, y, 110, cols[N - 1], 360);
    burst(x, y, { count: 30, spread: 210, colors: cols });
  }, 250);
}

$('#next').onclick = () => { if (S && S.locked) nextQ(); };
$('#replay').onclick = () => { if (S && S.cur){ peek(null); playBoard(); } };
const inPlay = () => !!(history.state && history.state.play);
function enterPlay(){ try { if (!inPlay()) history.pushState({ play: 1 }, '', '#play'); } catch (e) {} }
function goHome(){ clearTimeout(autoT); clearTimeout(nextT); peek(null); renderHome(); show('home'); }
function leave(){ if (inPlay()) { try { history.back(); return; } catch (e) {} } goHome(); }
$('#back').onclick = leave;
$('#toHome').onclick = leave;
$('#again').onclick = () => start(S.mode);
addEventListener('popstate', () => { if (!screens.home.hidden) return; goHome(); });
try { if (location.hash === '#play') history.replaceState(null, '', location.pathname + location.search); } catch (e) {}

renderSound();
renderHome();
show('home');
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>

</body>
